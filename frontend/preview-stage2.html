<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>MESHNET - Stage 2 Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e3e6eb;--ac:#0b7a75;--bad:#c0392b;--ok:#1f8a4c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mut:#98a2b3;--bd:#262c36;--ac:#3cc4bc;--bad:#ff7a6b;--ok:#4cd68a}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mut:#98a2b3;--bd:#262c36;--ac:#3cc4bc;--bad:#ff7a6b;--ok:#4cd68a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:820px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0}.sub{color:var(--mut);font-size:13px;margin:2px 0 14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.c h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
button{background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap}code{font-size:12px;word-break:break-all;color:var(--mut)}
.l{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}.l:last-child{border:0}
.p{font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;height:fit-content;white-space:nowrap}
.ok .p{color:var(--ok);border:1px solid var(--ok)}.no .p{color:var(--bad);border:1px solid var(--bad)}
</style></head><body><div class="w"><div id="root"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const h=React.createElement,{useState,useRef}=React,enc=new TextEncoder();
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const sha=s=>crypto.subtle.digest('SHA-256',enc.encode(s));
const A={name:'Ed25519'};
// In-page stand-in for the Express server (same checks as backend/auth.js)
async function serverCheck(S,r){
 if(Math.abs(Date.now()-r.ts)>30000)return'stale timestamp';
 if(S.seen.has(r.sig))return'replay detected';
 const msg=enc.encode(`POST\n/api/telemetry\n${r.ts}\n${hex(await sha(r.body))}`);
 const sig=Uint8Array.from(atob(r.sig),c=>c.charCodeAt(0));
 if(!await crypto.subtle.verify(A,S.serverPub,sig,msg))return'invalid signature';
 S.seen.add(r.sig);return null;
}
async function makeReq(S,body,ts){
 const msg=enc.encode(`POST\n/api/telemetry\n${ts}\n${hex(await sha(body))}`);
 return{ts,body,sig:b64(await crypto.subtle.sign(A,S.kp.privateKey,msg))};
}
function App(){
 const S=useRef({seen:new Set()}).current,[log,setLog]=useState([]),[id,setId]=useState(null),[err,setErr]=useState(null);
 const add=(ok,t,v)=>setLog(l=>[{ok,t,v},...l]);
 const body='{"battery_percent":81,"load":0.23}';
 async function register(){
  try{
   S.kp=await crypto.subtle.generateKey(A,true,['sign','verify']);
   const raw=await crypto.subtle.exportKey('raw',S.kp.publicKey);
   const nid=hex(await crypto.subtle.digest('SHA-256',raw)).slice(0,32);
   add(true,'Node generated an Ed25519 keypair; node_id derived from public key',nid);
   const nonce=crypto.getRandomValues(new Uint8Array(32));
   add(true,'Server issued a 32-byte challenge nonce',b64(nonce).slice(0,24)+'…');
   const sig=await crypto.subtle.sign(A,S.kp.privateKey,nonce);
   S.serverPub=await crypto.subtle.importKey('raw',raw,A,true,['verify']);
   const ok=await crypto.subtle.verify(A,S.serverPub,sig,nonce);
   add(ok,'Server verified proof of key possession → node registered',null);setId(nid);
  }catch(e){setErr('This browser does not support Ed25519 in WebCrypto. Try a recent Chrome, Safari or Firefox.')}
 }
 async function send(kind){
  let r;
  if(kind==='ok'){r=await makeReq(S,body,Date.now());S.last=r}
  if(kind==='tamper'){r={...await makeReq(S,body,Date.now()),body:'{"battery_percent":100,"load":0}'}}
  if(kind==='replay'){r=S.last;if(!r)return add(false,'Send a valid request first','')}
  if(kind==='stale'){r=await makeReq(S,body,Date.now()-120000)}
  const e=await serverCheck(S,r),label={ok:'Valid signed telemetry',tamper:'Payload altered after signing',replay:'Replayed an earlier request',stale:'Request with 2-minute-old timestamp'}[kind];
  add(kind==='ok'?!e:!!e,label,e?'Rejected: '+e:'Accepted');
 }
 return h('div',null,h('h1',null,'MESHNET Security Layer'),
  h('div',{className:'sub'},'Stage 2 preview - cryptographic node identity and signed requests (runs live in your browser)'),
  err&&h('div',{className:'c',style:{color:'var(--bad)'}},err),
  h('div',{className:'c'},h('h2',null,'Node identity'),
   h('div',{className:'row'},h('button',{onClick:register,disabled:!!id},id?'Registered':'Generate identity & register')),
   id&&h('p',null,'node_id: ',h('code',null,id))),
  h('div',{className:'c'},h('h2',null,'Signed request tests'),
   h('div',{className:'row'},
    h('button',{disabled:!id,onClick:()=>send('ok')},'Send valid telemetry'),
    h('button',{className:'s',disabled:!id,onClick:()=>send('tamper')},'Tamper with payload'),
    h('button',{className:'s',disabled:!id,onClick:()=>send('replay')},'Replay request'),
    h('button',{className:'s',disabled:!id,onClick:()=>send('stale')},'Stale timestamp'))),
  h('div',{className:'c'},h('h2',null,'Security log'),
   log.length?log.map((x,i)=>h('div',{key:i,className:'l '+(x.ok?'ok':'no')},h('span',{className:'p'},x.ok?'PASS':'FAIL'),h('div',null,x.t,x.v&&h('div',null,h('code',null,x.v))))):h('div',{style:{color:'var(--mut)'}},'Register a node to begin.')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
